spring:
  application:
    name: api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shamsma}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:classpath:keys/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  file-storage:
    endpoint: ${FILE_STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${FILE_STORAGE_PUBLIC_ENDPOINT:${FILE_STORAGE_ENDPOINT:http://localhost:9000}}
    access-key: ${FILE_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${FILE_STORAGE_SECRET_KEY:minioadmin}
    bucket: ${FILE_STORAGE_BUCKET:shamsma-certs-dev}
  cmi:
    # No real CMI merchant account exists yet (see Epic 4 planning) — MockCmiCheckoutServiceImpl
    # is the only CmiCheckoutService implementation, so merchant-id/api-key aren't consumed
    # anywhere yet. secret is real and used for HMAC webhook signature verification even against
    # the mock, so it always needs a value (dev/test default below).
    secret: ${CMI_SECRET:mock-cmi-dev-secret}

geocoding:
  base-url: ${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
  user-agent: ${GEOCODING_USER_AGENT:Shams.ma/1.0 (contact@shams.ma)}

server:
  port: ${SERVER_PORT:8080}

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health
